<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="215" viewBox="0 0 1000 215" role="img" aria-label="Developer quote: Talk is cheap. Show me the code. By Linus Torvalds.">
<title>Developer quote by Linus Torvalds</title>
<desc>Monochrome terminal card. Talk is cheap. Show me the code.</desc>
<defs>
 <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fafafa"/></linearGradient>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#666666" opacity=".16"/></pattern>
 <clipPath id="clip"><rect x="1" y="1" width="998" height="213" rx="17"/></clipPath>
</defs>
<rect width="1000" height="215" rx="17" fill="#fafafa"/>
<g clip-path="url(#clip)">
 <rect width="1000" height="215" fill="url(#panel)"/>
 <rect width="1000" height="215" fill="url(#dots)"/>
 <rect x="20" y="18" width="960" height="179" rx="12" fill="#ffffff" opacity=".78" stroke="#bdbdbd"/>
 <circle cx="47" cy="39" r="4" fill="#666666"/>
 <circle cx="62" cy="39" r="4" fill="#666666" opacity=".65"/>
 <circle cx="77" cy="39" r="4" fill="#666666" opacity=".36"/>
 <text x="100" y="43" font-family="Consolas,Menlo,monospace" font-size="13" fill="#666666" letter-spacing=".5">~/notes/developer.quote</text>
 <text x="946" y="43" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="11" fill="#666666" letter-spacing="1.5">READ ONLY</text>
 <path d="M37 59H963" stroke="#bdbdbd" stroke-width="1" opacity=".55"/>
 <text x="59" y="119" font-family="Consolas,Menlo,monospace" font-size="24" font-weight="bold" fill="#171717">"Talk is cheap. Show me the code."</text>
 <text x="59" y="163" font-family="Consolas,Menlo,monospace" font-size="15" fill="#666666">— Linus Torvalds</text>
 <rect x="821" y="155" width="10" height="15" rx="1" fill="#171717" opacity=".8"><animate attributeName="opacity" values=".8;.8;0;0;.8" keyTimes="0;.45;.5;.95;1" dur="1.8s" repeatCount="indefinite"/></rect>
 </g>
 <rect x=".8" y=".8" width="998.4" height="213.4" rx="16.5" fill="none" stroke="#bdbdbd" opacity=".7"/>
</svg>